<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gestionnaire OneDrive</title>
  <!-- SDK MSAL pour la gestion de l'authentification Microsoft -->
  <script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f9; color: #333; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; margin: 0 auto 20px; }
    h2 { margin-top: 0; color: #0078d4; }
    input[type="text"], input[type="file"] { width: 100%; padding: 8px; margin: 8px 0 16px; box-sizing: border-box; }
    button { background-color: #0078d4; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #005a9e; }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    .hidden { display: none; }
    #log { background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 6px; font-family: monospace; white-space: pre-wrap; font-size: 13px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Connexion OneDrive</h2>
    <button id="authBtn" onclick="toggleAuth()">Se connecter</button>
  </div>

  <div id="app" class="card hidden">
    <h2>1. Récupérer un fichier</h2>
    <label>Chemin du fichier (ex: <code>Dossier/mon_fichier.txt</code>) :</label>
    <input type="text" id="readFilePath" placeholder="Ex: Documents/test.txt">
    <button onclick="downloadFile()">Télécharger / Lire</button>

    <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">

    <h2>2. Ajouter un fichier</h2>
    <label>Dossier de destination (ex: <code>Dossier</code> ou laisser vide pour la racine) :</label>
    <input type="text" id="uploadFolderPath" placeholder="Ex: Documents">
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Uploader le fichier</button>
  </div>

  <div class="card">
    <h3>Journal d'actions</h3>
    <div id="log">En attente d'action...</div>
  </div>

  <script>
    // Configuration Microsoft Azure / Entra ID
    const CLIENT_ID = "be837dea-ba6d-431e-b6c6-3f7be96010a5"; // Remplacez par votre Application (client) ID
    const SCOPES = ["User.Read", "Files.ReadWrite"];

    const msalConfig = {
      auth: {
        clientId: CLIENT_ID,
        authority: "https://login.microsoftonline.com/common",
        redirectUri: window.location.origin + window.location.pathname
      }
    };

    const msalInstance = new msal.PublicClientApplication(msalConfig);
    let account = null;

    function log(msg) {
      document.getElementById('log').innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
    }

    // Gestion de la connexion
    async function toggleAuth() {
      if (!account) {
        try {
          const response = await msalInstance.loginPopup({ scopes: SCOPES });
          account = response.account;
          updateUI();
          log("Connecté en tant que : " + account.username);
        } catch (err) {
          log("Erreur de connexion : " + err.message);
        }
      } else {
        msalInstance.logoutPopup();
        account = null;
        updateUI();
        log("Déconnecté.");
      }
    }

    function updateUI() {
      const btn = document.getElementById('authBtn');
      const app = document.getElementById('app');
      if (account) {
        btn.innerText = "Se déconnecter";
        app.classList.remove('hidden');
      } else {
        btn.innerText = "Se connecter";
        app.classList.add('hidden');
      }
    }

    // Obtenir le jeton d'accès pour Microsoft Graph API
    async function getToken() {
      const request = { scopes: SCOPES, account: account };
      try {
        const response = await msalInstance.acquireTokenSilent(request);
        return response.accessToken;
      } catch (err) {
        const response = await msalInstance.acquireTokenPopup(request);
        return response.accessToken;
      }
    }

    // 1. RÉCUPÉRATION D'UN FICHIER
    async function downloadFile() {
      const path = document.getElementById('readFilePath').value.trim();
      if (!path) return alert("Veuillez saisir le chemin du fichier.");

      log(`Recherche de "${path}"...`);
      try {
        const token = await getToken();
        // Obtention de l'URL de téléchargement direct depuis l'API Graph
        const response = await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${encodeURIComponent(path)}`, {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (!response.ok) throw new Error("Fichier introuvable ou accès refusé.");

        const data = await response.json();
        const downloadUrl = data['@microsoft.graph.downloadUrl'];

        // Téléchargement automatique via un élément <a> temporaire
        const link = document.createElement('a');
        link.href = downloadUrl;
        link.download = data.name;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        log(`Fichier "${data.name}" prêt et en cours de téléchargement !`);
      } catch (err) {
        log("Erreur : " + err.message);
      }
    }

    // 2. AJOUT / UPLOAD DE FICHIER (AVEC RENOMMAGE AUTOMATIQUE)
    async function uploadFile() {
      const fileInput = document.getElementById('fileInput');
      const folderPath = document.getElementById('uploadFolderPath').value.trim();

      if (fileInput.files.length === 0) return alert("Veuillez choisir un fichier.");
      const file = fileInput.files[0];

      log(`Envoi du fichier "${file.name}"...`);
      try {
        const token = await getToken();
        
        // Construction de l'URL avec gestion automatique des conflits (@microsoft.graph.conflictBehavior=rename)
        let basePath = folderPath ? `root:/${encodeURIComponent(folderPath)}:/children/${encodeURIComponent(file.name)}` : `root/children/${encodeURIComponent(file.name)}`;
        const endpoint = `https://graph.microsoft.com/v1.0/me/drive/${basePath}/content?@microsoft.graph.conflictBehavior=rename`;

        const response = await fetch(endpoint, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': file.type || 'application/octet-stream'
          },
          body: file
        });

        if (!response.ok) throw new Error("Erreur lors de l'envoi du fichier.");

        const data = await response.json();
        log(`Succès ! Fichier enregistré sous le nom : "${data.name}"`);
      } catch (err) {
        log("Erreur : " + err.message);
      }
    }
  </script>
</body>
</html>
