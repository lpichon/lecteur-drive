<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Mot de Passe JSON</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.25rem;
            margin-bottom: 12px;
            color: #38bdf8;
        }

        .subtitle {
            font-size: 0.875rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        pre {
            background-color: #020617;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
            color: #4ade80;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .examples {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #334155;
        }

        .examples h2 {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .examples a {
            display: inline-block;
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.85rem;
            margin-bottom: 6px;
            background: #0f172a;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
        }

        .examples a:hover {
            border-color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Résultat JSON</h1>
        <p class="subtitle">Paramètres GET détectés depuis l'URL</p>
        
        <pre id="json-output">Génération en cours...</pre>

        <div class="examples">
            <h2>Tester avec différents paramètres GET :</h2>
            <a href="?min=true&maj=true&longeur=12">?min=true&maj=true&longeur=12</a><br>
            <a href="?min=true&maj=true&chiffre=true&longeur=16">?min=true&maj=true&chiffre=true&longeur=16</a><br>
            <a href="?maj=true&longeur=8">?maj=true&longeur=8</a>
        </div>
    </div>

    <script>
        function generatePassword() {
            // Lecture des paramètres GET
            const urlParams = new URLSearchParams(window.location.search);

            // Parsing des options (supporte 'longeur' et 'longueur')
            const lengthParam = urlParams.get('longeur') || urlParams.get('longueur');
            const length = parseInt(lengthParam, 10) || 12;
            
            const useMin = urlParams.get('min') === 'true';
            const useMaj = urlParams.get('maj') === 'true';
            const useChiffre = urlParams.get('chiffre') === 'true' || urlParams.get('num') === 'true';
            const useSpecial = urlParams.get('special') === 'true';

            // Jeux de caractères
            const charSets = {
                lowercase: 'abcdefghijklmnopqrstuvwxyz',
                uppercase: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
                numbers: '0123456789',
                special: '!@#$%^&*()_+-=[]{}|;:,.<>?'
            };

            let availableChars = '';
            if (useMin) availableChars += charSets.lowercase;
            if (useMaj) availableChars += charSets.uppercase;
            if (useChiffre) availableChars += charSets.numbers;
            if (useSpecial) availableChars += charSets.special;

            let password = '';
            let error = null;

            // Vérification si au moins une option est activée
            if (availableChars.length === 0) {
                error = "Aucun jeu de caractères sélectionné. Spécifiez au moins un paramètre valide (ex: min=true, maj=true).";
            } else {
                // Génération sécurisée du mot de passe
                const array = new Uint32Array(length);
                window.crypto.getRandomValues(array);
                for (let i = 0; i < length; i++) {
                    password += availableChars[array[i] % availableChars.length];
                }
            }

            // Structure de la réponse JSON
            const responseData = error ? {
                status: "error",
                message: error
            } : {
                status: "success",
                password: password,
                length: length,
                options: {
                    min: useMin,
                    maj: useMaj,
                    chiffre: useChiffre,
                    special: useSpecial
                }
            };

            // Affichage formaté en JSON
            document.getElementById('json-output').textContent = JSON.stringify(responseData, null, 2);
        }

        // Exécution au chargement de la page
        generatePassword();
    </script>
</body>
</html>
