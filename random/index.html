<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Générateur de mot de passe — style API (sans serveur)</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #f1f5f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 2rem;
    width: 420px;
    max-width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.15rem;
    margin-top: 0;
    text-align: center;
    color: #38bdf8;
  }
  .subtitle {
    font-size: 0.75rem;
    text-align: center;
    color: #64748b;
    margin-top: -8px;
    margin-bottom: 1.2rem;
  }
  .url-preview {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.78rem;
    color: #94a3b8;
    word-break: break-all;
    margin-bottom: 1.2rem;
    font-family: 'Consolas', monospace;
  }
  .url-preview .label { color: #64748b; display:block; margin-bottom:4px; font-size:0.7rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .url-preview span.val { color: #38bdf8; }

  .options label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 0.95rem;
  }
  .length-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  input[type="range"] { width: 100%; margin-bottom: 1rem; }

  button#generateBtn {
    width: 100%;
    padding: 12px;
    background: #38bdf8;
    border: none;
    border-radius: 8px;
    color: #0f172a;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.2s;
  }
  button#generateBtn:hover { background: #0ea5e9; }

  .json-box {
    margin-top: 1.5rem;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 14px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-break: break-all;
    min-height: 60px;
    position: relative;
  }
  .json-key { color: #38bdf8; }
  .json-string { color: #a3e635; }
  .json-number { color: #f59e0b; }
  .json-boolean { color: #f472b6; }
  .json-error { color: #ef4444; }

  .copyJsonBtn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: #334155;
    border: none;
    border-radius: 6px;
    color: #f1f5f9;
    padding: 4px 8px;
    font-size: 0.75rem;
    cursor: pointer;
  }
  .copyJsonBtn:hover { background: #475569; }

  .status {
    font-size: 0.75rem;
    text-align: right;
    margin-top: 6px;
    color: #64748b;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🔐 Générateur de mot de passe</h1>
  <div class="subtitle">Simulation d'API — 100% JavaScript, sans serveur</div>

  <div class="length-row">
    <span>Longueur (longueur)</span>
    <span id="lengthValue">12</span>
  </div>
  <input type="range" id="longueur" min="4" max="32" value="12">

  <div class="options">
    <label>
      Majuscules (maj)
      <input type="checkbox" id="maj" checked>
    </label>
    <label>
      Minuscules (min)
      <input type="checkbox" id="min" checked>
    </label>
    <label>
      Chiffres (chiffre)
      <input type="checkbox" id="chiffre" checked>
    </label>
    <label>
      Symboles (symbole)
      <input type="checkbox" id="symbole">
    </label>
  </div>

  <div class="url-preview">
    <span class="label">Requête simulée</span>
    GET <span class="val" id="urlText"></span>
  </div>

  <button id="generateBtn">🔄 Générer (appel simulé)</button>

  <div class="json-box">
    <button class="copyJsonBtn" id="copyJsonBtn">📋 Copier</button>
    <div id="jsonOutput">{ }</div>
  </div>
  <div class="status" id="statusText"></div>
</div>

<script>
const CHARSETS = {
  min: 'abcdefghijklmnopqrstuvwxyz',
  maj: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  chiffre: '0123456789',
  symbole: '!@#$%^&*()_+-=[]{}|;:,.<>?'
};

const longueurInput = document.getElementById('longueur');
const lengthValue = document.getElementById('lengthValue');
const majCheck = document.getElementById('maj');
const minCheck = document.getElementById('min');
const chiffreCheck = document.getElementById('chiffre');
const symboleCheck = document.getElementById('symbole');
const urlText = document.getElementById('urlText');
const generateBtn = document.getElementById('generateBtn');
const jsonOutput = document.getElementById('jsonOutput');
const statusText = document.getElementById('statusText');
const copyJsonBtn = document.getElementById('copyJsonBtn');

function buildQueryString() {
  const params = new URLSearchParams({
    min: minCheck.checked,
    maj: majCheck.checked,
    chiffre: chiffreCheck.checked,
    symbole: symboleCheck.checked,
    longueur: longueurInput.value
  });
  return `/password?${params.toString()}`;
}

function refreshUrlPreview() {
  urlText.textContent = buildQueryString();
}

function randomChar(chars) {
  // Aléatoire cryptographiquement sûr via l'API Web Crypto (native au navigateur)
  const array = new Uint32Array(1);
  crypto.getRandomValues(array);
  return chars[array[0] % chars.length];
}

// Reproduit exactement la logique de l'API server.js, mais exécutée côté client
function genererMotDePasse({ min, maj, chiffre, symbole, longueur }) {
  let pool = '';
  const garanties = [];

  if (maj) { pool += CHARSETS.maj; garanties.push(randomChar(CHARSETS.maj)); }
  if (min) { pool += CHARSETS.min; garanties.push(randomChar(CHARSETS.min)); }
  if (chiffre) { pool += CHARSETS.chiffre; garanties.push(randomChar(CHARSETS.chiffre)); }
  if (symbole) { pool += CHARSETS.symbole; garanties.push(randomChar(CHARSETS.symbole)); }

  if (pool === '') {
    return { erreur: "Aucune catégorie de caractère sélectionnée (min, maj, chiffre, symbole)." };
  }

  let resultat = [...garanties];
  for (let i = resultat.length; i < longueur; i++) {
    resultat.push(randomChar(pool));
  }
  resultat = resultat.slice(0, longueur);

  for (let i = resultat.length - 1; i > 0; i--) {
    const array = new Uint32Array(1);
    crypto.getRandomValues(array);
    const j = array[0] % (i + 1);
    [resultat[i], resultat[j]] = [resultat[j], resultat[i]];
  }

  return { password: resultat.join('') };
}

function highlightJson(obj) {
  const json = JSON.stringify(obj, null, 2);
  return json
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,
      (match) => {
        let cls = 'json-number';
        if (/^"/.test(match)) {
          cls = /:$/.test(match) ? 'json-key' : 'json-string';
        } else if (/true|false/.test(match)) {
          cls = 'json-boolean';
        }
        return `<span class="${cls}">${match}</span>`;
      });
}

function appelerApiSimulee() {
  refreshUrlPreview();
  generateBtn.disabled = true;

  const t0 = performance.now();

  const options = {
    min: minCheck.checked,
    maj: majCheck.checked,
    chiffre: chiffreCheck.checked,
    symbole: symboleCheck.checked,
    longueur: Math.min(Math.max(parseInt(longueurInput.value, 10) || 12, 4), 128)
  };

  const resultat = genererMotDePasse(options);
  const t1 = performance.now();

  if (resultat.erreur) {
    jsonOutput.innerHTML = highlightJson(resultat);
    statusText.textContent = `⚠️ 400 Bad Request — ${(t1 - t0).toFixed(2)} ms`;
  } else {
    const reponse = {
      password: resultat.password,
      longueur: options.longueur,
      options: {
        min: options.min,
        maj: options.maj,
        chiffre: options.chiffre,
        symbole: options.symbole
      }
    };
    jsonOutput.innerHTML = highlightJson(reponse);
    statusText.textContent = `✅ 200 OK — ${(t1 - t0).toFixed(2)} ms`;
  }

  generateBtn.disabled = false;
}

copyJsonBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(jsonOutput.textContent).then(() => {
    copyJsonBtn.textContent = '✅ Copié';
    setTimeout(() => copyJsonBtn.textContent = '📋 Copier', 1200);
  });
});

longueurInput.addEventListener('input', () => {
  lengthValue.textContent = longueurInput.value;
  refreshUrlPreview();
});
[majCheck, minCheck, chiffreCheck, symboleCheck].forEach(el => {
  el.addEventListener('change', refreshUrlPreview);
});

generateBtn.addEventListener('click', appelerApiSimulee);

// Génération initiale
refreshUrlPreview();
appelerApiSimulee();
</script>

</body>
</html>
