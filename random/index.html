<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>API Générateur de mot de passe — JSON</title>
<style>
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #1e293b, #0f172a);
    color: #f1f5f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 2rem;
    width: 420px;
    max-width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
  }
  h1 {
    font-size: 1.15rem;
    margin-top: 0;
    text-align: center;
    color: #38bdf8;
  }
  .url-preview {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.8rem;
    color: #94a3b8;
    word-break: break-all;
    margin-bottom: 1.2rem;
    font-family: 'Consolas', monospace;
  }
  .url-preview span { color: #38bdf8; }

  .options label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 0.95rem;
  }
  .length-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  input[type="range"] { width: 100%; margin-bottom: 1rem; }

  #apiBase {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #f8fafc;
    font-size: 0.85rem;
    margin-bottom: 1rem;
    font-family: 'Consolas', monospace;
  }

  button#generateBtn {
    width: 100%;
    padding: 12px;
    background: #38bdf8;
    border: none;
    border-radius: 8px;
    color: #0f172a;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    margin-top: 4px;
    transition: background 0.2s;
  }
  button#generateBtn:hover { background: #0ea5e9; }
  button#generateBtn:disabled { background: #475569; cursor: wait; }

  .json-box {
    margin-top: 1.5rem;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 14px;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-break: break-all;
    min-height: 60px;
    max-height: 260px;
    overflow-y: auto;
  }
  .json-key { color: #38bdf8; }
  .json-string { color: #a3e635; }
  .json-number { color: #f59e0b; }
  .json-boolean { color: #f472b6; }
  .json-error { color: #ef4444; }

  .status {
    font-size: 0.75rem;
    text-align: right;
    margin-top: 6px;
    color: #64748b;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🔐 API Générateur de mot de passe</h1>

  <label style="font-size:0.8rem; color:#94a3b8;">URL de l'API</label>
  <input type="text" id="apiBase" value="http://localhost:3000/password">

  <div class="length-row">
    <span>Longueur</span>
    <span id="lengthValue">12</span>
  </div>
  <input type="range" id="longueur" min="4" max="32" value="12">

  <div class="options">
    <label>
      Majuscules (maj)
      <input type="checkbox" id="maj" checked>
    </label>
    <label>
      Minuscules (min)
      <input type="checkbox" id="min" checked>
    </label>
    <label>
      Chiffres (chiffre)
      <input type="checkbox" id="chiffre" checked>
    </label>
    <label>
      Symboles (symbole)
      <input type="checkbox" id="symbole">
    </label>
  </div>

  <div class="url-preview">GET <span id="urlText"></span></div>

  <button id="generateBtn">🔄 Appeler l'API</button>

  <div class="json-box" id="jsonOutput">{ }</div>
  <div class="status" id="statusText"></div>
</div>

<script>
const apiBaseInput = document.getElementById('apiBase');
const longueurInput = document.getElementById('longueur');
const lengthValue = document.getElementById('lengthValue');
const majCheck = document.getElementById('maj');
const minCheck = document.getElementById('min');
const chiffreCheck = document.getElementById('chiffre');
const symboleCheck = document.getElementById('symbole');
const urlText = document.getElementById('urlText');
const generateBtn = document.getElementById('generateBtn');
const jsonOutput = document.getElementById('jsonOutput');
const statusText = document.getElementById('statusText');

function buildUrl() {
  const base = apiBaseInput.value.trim() || 'http://localhost:3000/password';
  const params = new URLSearchParams({
    min: minCheck.checked,
    maj: majCheck.checked,
    chiffre: chiffreCheck.checked,
    symbole: symboleCheck.checked,
    longueur: longueurInput.value
  });
  return `${base}?${params.toString()}`;
}

function refreshUrlPreview() {
  urlText.textContent = buildUrl();
}

// Coloration syntaxique JSON simple
function highlightJson(obj) {
  const json = JSON.stringify(obj, null, 2);
  return json
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|-?\d+(?:\.\d*)?(?:[eE][+-]?\d+)?)/g,
      (match) => {
        let cls = 'json-number';
        if (/^"/.test(match)) {
          cls = /:$/.test(match) ? 'json-key' : 'json-string';
        } else if (/true|false/.test(match)) {
          cls = 'json-boolean';
        }
        return `<span class="${cls}">${match}</span>`;
      });
}

async function appelerApi() {
  const url = buildUrl();
  refreshUrlPreview();
  generateBtn.disabled = true;
  generateBtn.textContent = '⏳ Appel en cours...';
  statusText.textContent = '';

  try {
    const t0 = performance.now();
    const response = await fetch(url);
    const data = await response.json();
    const t1 = performance.now();

    if (!response.ok) {
      jsonOutput.innerHTML = highlightJson(data);
      statusText.textContent = `⚠️ HTTP ${response.status} — ${Math.round(t1 - t0)} ms`;
    } else {
      jsonOutput.innerHTML = highlightJson(data);
      statusText.textContent = `✅ HTTP ${response.status} — ${Math.round(t1 - t0)} ms`;
    }
  } catch (err) {
    jsonOutput.innerHTML = `<span class="json-error">Erreur : impossible de joindre l'API (${err.message}).\nVérifiez que le serveur tourne bien (node server.js) et que l'URL est correcte.</span>`;
    statusText.textContent = '❌ Échec de la requête';
  } finally {
    generateBtn.disabled = false;
    generateBtn.textContent = '🔄 Appeler l\'API';
  }
}

longueurInput.addEventListener('input', () => {
  lengthValue.textContent = longueurInput.value;
  refreshUrlPreview();
});
[majCheck, minCheck, chiffreCheck, symboleCheck, apiBaseInput].forEach(el => {
  el.addEventListener('input', refreshUrlPreview);
  el.addEventListener('change', refreshUrlPreview);
});

generateBtn.addEventListener('click', appelerApi);

refreshUrlPreview();
</script>

</body>
</html>
